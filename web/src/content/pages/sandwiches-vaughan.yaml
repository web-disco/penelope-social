title: Italian Focaccia Sandwiches in Vaughan
breadcrumb: Focaccia Sandwiches
seo:
  title: Italian Focaccia Sandwiches in Vaughan | Penelope Social
  description: Italian sandwiches on sourdough focaccia, $19 to $23. Mortadella, prosciutto, steak and more at lunch, 125 Hawkview Blvd, Woodbridge. Order online.
schemaMenu:
  - menu: lunch
    category: focaccia
    name: Sourdough focaccia sandwiches
sections:
  - type: pageHero
    image:
      src: mortadella-sandwich-tray.jpg
      alt: A tray of mortadella focaccia sandwiches at Penelope Social in Vaughan
    heading: Italian Focaccia Sandwiches in Vaughan
    intro: Focaccia sandwiches on our own sourdough, at lunch in Woodbridge.
  - type: richTextIntro
    heading: What makes a focaccia sandwich different?
    body: |-
      Most sandwiches are built on a soft sub roll. Ours start with Focaccia Romana, a sourdough focaccia baked at Penelope Bakehouse from the same starter as our pizza. It's crisp on the outside, open and soft inside, and sturdy enough to carry Prosciutto di Parma, mortadella and stracciatella without falling apart.

      Our Italian sandwiches are on the lunch menu, served Monday to Saturday from 10am at our Woodbridge kitchen in Vaughan, alongside [sourdough pizza](/pizza-vaughan) by the slice.
  - type: menuItemCards
    heading: Focaccia sandwiches worth the drive
    intro: Italian sandwiches on sourdough focaccia, from $19 to $23. Here are four to start with.
    rating: true
