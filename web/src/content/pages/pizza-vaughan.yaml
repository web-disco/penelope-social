  - type: faqSection
    heading: FAQs
    items:
      - question: Where can I get sourdough pizza in Vaughan?
        answer: At Penelope Social, 125 Hawkview Blvd in Woodbridge. We serve Roman-style slices at lunch and 14-inch New York-style pies at dinner, all made with our own sourdough starter.
      - question: What's the difference between the lunch and dinner pizza?
        answer: Lunch is Roman-style sourdough sold by the slice, cold-fermented for 48 hours, at $6 to $7 a slice. Dinner is 14-inch New York-style pies from the same starter, from $25 to $31.
      - question: Is the dough really sourdough?
        answer: Yes. Every dough is naturally leavened with Penelope, the starter we've kept going since 2018. It's made at Penelope Bakehouse in Scarborough, then topped and baked here in Woodbridge.
      - question: When can I get pizza?
        answer: Slices are on the lunch menu. Whole pies are on the dinner menu, served at the bar from 5pm, Monday to Saturday. The bar is closed Sunday night.
      - question: Can I order pizza online?
        answer: Yes. Use the Order online button on this page to order from Penelope Social through Toast.
      - question: Do you do pizza catering for events in Vaughan?
        answer: Yes. Full-size 24-piece pizzas are on our catering menu, and catering orders need at least 24 hours' notice. We can also host your event at our space in Woodbridge.
  - type: finalCta
    heading: Looking for pizza in Vaughan tonight?
