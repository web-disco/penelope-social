  - type: richTextIntro
    heading: What makes a pizza sourdough?
    body: |-
      Most pizza dough rises on commercial yeast, and it rises fast. Sourdough rises on a starter instead: a live culture of flour and water that does the work slowly. That natural ferment is the whole difference.

      You can taste it. The crust has a light tang and more depth than a standard base, with a crisp bottom and an open, airy middle. It holds up under the toppings instead of going soft. And because the long ferment breaks down more of the flour before it ever reaches the oven, a lot of people find it sits lighter, too.
