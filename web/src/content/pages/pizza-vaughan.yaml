  - type: mediaTextCta
    layout: image-first
    heading: A starter called Penelope
    body: |-
      It began in 2018 as a starter called Anastasia. It was nearly lost while the restaurant was opening, brought back to life, and renamed Penelope. The restaurant and the Bakehouse both grew from it.

      Today it lives at Penelope [Bakehouse in Scarborough](/locations/scarborough), where the dough is made and naturally fermented. From there it comes to our [Woodbridge location](/locations/woodbridge) in Vaughan to be topped and baked.
    image:
      src: penelope-starter.jpg
      alt: The Penelope sourdough starter
      objectPosition: 50% 53%
    ctas:
      - label: About the Bakehouse
        url: https://penelopebakehouse.com/about
        style: outline
        newTab: true
  - type: comparisonTable
    heading: Sourdough pizza vs regular pizza
    intro: The difference starts long before the toppings go on.
    columns:
      - Penelope sourdough pizza
      - Regular pizza
    rows:
      - label: Rises with
        values:
          - A live sourdough starter
          - Commercial yeast
      - label: Ferment
        values:
          - Cold-fermented for 48 hours
          - Often a few hours, sometimes a day in the fridge
      - label: Flavour
        values:
          - A light tang and more depth, from the long ferment
          - Mild, mostly there to carry the toppings
      - label: Crust
        values:
          - Crisp underneath and airy inside, and it holds up under the toppings
          - Softer, and more likely to go limp in the middle
      - label: Made
        values:
          - Dough made at our Scarborough bakehouse, baked in Woodbridge
          - Often made in bulk, sometimes frozen
