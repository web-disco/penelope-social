  image:
    src: about-banner.avif
    alt: The room at Penelope Social
    objectPosition: center 50%
  heading: About Penelope Social
  intro: A Woodbridge cafe and bar, with lunch and dinner, plus drinks.

# Paragraphs, separated by a blank line. Years live only in the timeline.
body: |-
  A cafe and bar in Woodbridge, Vaughan. [Cafe by day](/cafe-in-vaughan), kitchen and bar at night. Bakehouse sourdough on the table as [sandwiches](/sandwiches-vaughan) and [pizza](/pizza-vaughan), or as bread.

  The Stalteri brothers built Social around good sourdough bread and a proper bar. Franco, Vince, Giuliano.

timeline:
  heading: How Penelope started
  steps:
    - title: "2017"
      body: On May 17, Vince Stalteri left construction as a project manager and engineer to follow food.
    - title: "2018"
      body: He started learning sourdough and made his first starter, Anastasia. He nearly lost it, then revived it and renamed it Penelope.
    - title: "2024"
      body: Penelope became the base for the doughs at Social. Breads and pizzas drawn from Italy and further.
    - title: "2026"
      body: Penelope Bakehouse opens in Scarborough. Home for the sourdough that feeds Social, plus focaccia sandwiches and pizza by the slice.

video:
  heading: Inside the bake
  body: Vince’s starter still works the dough, and we serve that bread here as sandwiches and pizza, and as loaves.
